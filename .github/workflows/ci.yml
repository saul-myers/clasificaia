# Integración continua: en cada push a main se entrena, se prueba, se escanea la
# imagen y, solo si todo pasa, se publica en GitHub Container Registry (GHCR).

name: ci

on:
  push:
    branches:
      - main

jobs:
  probar-y-publicar:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt

      - run: python modelo/entrenar.py

      - run: python -m pytest -q

      - run: docker build -t clasificaia:ci .

      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: clasificaia:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:latest